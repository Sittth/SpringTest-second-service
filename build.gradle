plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'

    id 'org.openapi.generator' version '7.8.0'
}

group = 'spring.ru'
version = '0.0.1-SNAPSHOT'
description = 'SecondService'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDir "$projectDir/src/generated/src/main/java"
        }
    }
}

tasks.register("generateCreateDto", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = file("src/main/resources/openapi/api.yaml").toURI().toString()
    outputDir = "$projectDir/src/generated"

    apiPackage = "spring.ru.secondservice.api"
    modelPackage = "spring.ru.secondservice.dto.create"

    globalProperties = [
            apis: "false",
            models: "BookMetadataCreateRequest"
    ]

    configOptions = [
            interfaceOnly: "true",
            useSpringBoot3: "true",
            useJakartaEe: 'true',
            useBeanValidation: "true",
            useResponseEntity: "false"
    ]
}

tasks.register("generateResponseDto", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = file("src/main/resources/openapi/api.yaml").toURI().toString()
    outputDir = "$projectDir/src/generated"

    apiPackage = "spring.ru.secondservice.api"
    modelPackage = "spring.ru.secondservice.dto.response"

    globalProperties = [
            apis: "false",
            models: "BookMetadataResponse," +
                    "ErrorResponse"
    ]

    configOptions = [
            interfaceOnly: "true",
            useSpringBoot3: "true",
            useJakartaEe: 'true',
            useBeanValidation: "true",
            useBuilder: "true",
            useResponseEntity: "false"
    ]
}

tasks.register("generateApi", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = file("src/main/resources/openapi/api.yaml").toURI().toString()
    outputDir = "$projectDir/src/generated"

    importMappings = [
            "BookMetadataCreateRequest": "spring.ru.secondservice.dto.create.BookMetadataCreateRequest",
            "BookMetadataResponse"     : "spring.ru.secondservice.dto.response.BookMetadataResponse",
            "ErrorResponse"            : "spring.ru.secondservice.dto.response.ErrorResponse"
    ]

    apiPackage = "spring.ru.secondservice.api"
    modelPackage = "spring.ru.secondservice.dto"

    globalProperties = [
            apis: "",
            models: "false",
            supportingFiles: "ApiUtil.java"
    ]

    configOptions = [
            interfaceOnly: "true",
            useSpringBoot3: "true",
            useJakartaEe: 'true',
            useResponseEntity: "false"
    ]
}

tasks.register("generateAllDto") {
    dependsOn(
            "generateCreateDto",
            "generateResponseDto",
            "generateApi"
    )
}

compileJava.dependsOn tasks.generateAllDto